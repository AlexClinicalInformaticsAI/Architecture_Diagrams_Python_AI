# multi-cloud-diagram.yaml

metadata:
  name: "multi-cloud-diagram"
  author: "Jules"

elements:
  user:
    type: node
    label: "User"
    style:
      shape: "actor"
      fillColor: "#cce5ff"
      strokeColor: "#6c8ebf"
    size:
      width: 40
      height: 60

  aws_region:
    type: container
    label: "AWS Region (us-east-1)"
    style:
      shape: "swimlane"
      fillColor: "#f5f5f5"
      strokeColor: "#666666"
      dashed: 1
    children:
      - ec2_instance
      - rds_database

  ec2_instance:
    type: node
    label: "EC2 Instance"
    style:
      shape: "image"
      image: "data:image/svg+xml;base64,"
      verticalLabelPosition: "bottom"
      verticalAlign: "top"
    size:
      width: 50
      height: 50

  rds_database:
    type: node
    label: "RDS Database"
    style:
      shape: "cylinder"
      fillColor: "#ffe6cc"
      strokeColor: "#d79b00"
    size:
      width: 60
      height: 80

  azure_region:
    type: container
    label: "Azure Region (West US)"
    style:
      shape: "swimlane"
      fillColor: "#e6f0ff"
      strokeColor: "#6c8ebf"
      dashed: 1
    children:
      - app_service

  app_service:
    type: node
    label: "App Service"
    style:
      shape: "image"
      image: "data:image/svg+xml;base64,"
      verticalLabelPosition: "bottom"
      verticalAlign: "top"
    size:
      width: 50
      height: 50

connectors:
  - from: user
    to: ec2_instance
    label: "HTTPS"
    style:
      edgeStyle: "orthogonalEdgeStyle"
      endArrow: "classic"
      strokeColor: "#000000"
  - from: ec2_instance
    to: rds_database
    label: "SQL"
    style:
      edgeStyle: "entityRelationEdgeStyle"
      endArrow: "classic"
      strokeColor: "#000000"
  - from: user
    to: app_service
    label: "HTTPS"
    style:
      edgeStyle: "orthogonalEdgeStyle"
      endArrow: "classic"
      strokeColor: "#000000"

layout:
  - name: user
    position:
      x: 50
      y: 150
  - name: aws_region
    position:
      x: 200
      y: 50
  - name: azure_region
    position:
      x: 600
      y: 50
