    label: "appi-contoso"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

connectors:
  - from: user
    to: afd
  - from: afd
    to: agw
  - from: agw
    to: app_frontend_portal
  - from: app_frontend_portal
    to: app_order_api
  - from: app_order_api
    to: sql_db
  - from: app_order_api
    to: storage_account
  - from: func_order_processor
    to: sb_orders
  - from: sb_orders
    to: sql_db
  - from: app_frontend_portal
    to: key_vault
  - from: app_order_api
    to: key_vault
  - from: func_order_processor
    to: key_vault
  - from: app_frontend_portal
    to: law
  - from: app_order_api
    to: law
  - from: func_order_processor
    to: law
  - from: sql_server
    to: law
  - from: storage_account
    to: law
  - from: key_vault
    to: law
  - from: vnet
    to: azfw

layout:
  - name: user
    position:
      x: 800
      y: 50
  - name: afd
    position:
      x: 800
      y: 150
  - name: vnet
    position:
      x: 50
      y: 250
  - name: snet_frontend
    position:
      x: 750
      y: 350
  - name: snet_backend
    position:
      x: 750
      y: 600
  - name: snet_data
    position:
      x: 100
      y: 850
  - name: firewall_routing
    position:
      x: 100
      y: 1100
  - name: monitoring
    position:
      x: 1400
      y: 1100
