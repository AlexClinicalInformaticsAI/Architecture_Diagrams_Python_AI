# contoso-architecture-spec.yaml

metadata:
  name: "contoso-architecture"
  author: "Jules"

elements:
  vnet:
    type: container
    label: "vnet-contoso-auea-001\n(10.10.0.0/16)"
    style:
      shape: "swimlane"
      fillColor: "#e8f4f8"
      strokeColor: "#aeb6be"
      dashed: 1
    children:
      - snet_frontend
      - snet_backend
      - snet_data
      - firewall_routing

  snet_frontend:
    type: container
    label: "snet-frontend\n(10.10.1.0/24)"
    style:
      shape: "swimlane"
      fillColor: "#e3f2fd"
      strokeColor: "#aeb6be"
    children:
      - agw

  snet_backend:
    type: container
    label: "snet-backend\n(10.10.2.0/24)"
    style:
      shape: "swimlane"
      fillColor: "#f3e5f5"
      strokeColor: "#aeb6be"
    children:
      - app_frontend_portal
      - app_order_api
      - func_order_processor
      - sb_orders

  snet_data:
    type: container
    label: "snet-data\n(10.10.3.0/24)"
    style:
      shape: "swimlane"
      fillColor: "#fff3e0"
      strokeColor: "#aeb6be"
    children:
      - sql_server
      - sql_db
      - storage_account
      - key_vault

  firewall_routing:
    type: container
    label: "Firewall & Routing"
    style:
      shape: "swimlane"
      fillColor: "#ffebee"
      strokeColor: "#aeb6be"
    children:
      - azfw
      - route_table

  monitoring:
    type: container
    label: "Monitoring"
    style:
      shape: "swimlane"
      fillColor: "#e8f5e9"
      strokeColor: "#aeb6be"
    children:
      - law
      - appi

  user:
    type: node
    label: "User"
    style:
      shape: "actor"
      fillColor: "#cce5ff"
      strokeColor: "#6c8ebf"
    size:
      width: 40
      height: 60

  afd:
    type: node
    label: "afd-contoso\n(Front Door)"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  agw:
    type: node
    label: "agw-contoso\n(WAF)"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  app_frontend_portal:
    type: node
    label: "app-frontend-portal\n(Web App)"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  app_order_api:
    type: node
    label: "app-order-api\n(Backend API)"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  func_order_processor:
    type: node
    label: "func-order-processor\n(Function App)"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  sb_orders:
    type: node
    label: "sb-contoso-orders\n(Service Bus)"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  sql_server:
    type: node
    label: "sqlsrv-contoso"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  sql_db:
    type: node
    label: "sqldb-orders"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  storage_account:
    type: node
    label: "stcontosodata001"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  key_vault:
    type: node
    label: "kv-contoso-prod"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  azfw:
    type: node
    label: "azfw-contoso"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  route_table:
    type: node
    label: "Route Table"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
    size:
      width: 50
      height: 50

  law:
    type: node
    label: "law-contoso-prod"
    style:
      shape: image
      image: |
        data:image/svg+xml;base64,\
